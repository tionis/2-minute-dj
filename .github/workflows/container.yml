name: Test and publish application image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:server
      - name: Build container for smoke test
        run: docker build -f Containerfile -t 2-minute-dj:ci .
      - name: Smoke-test combined application
        run: |
          docker run -d --name 2-minute-dj-ci -p 127.0.0.1:12567:2567 2-minute-dj:ci
          trap 'docker rm -f 2-minute-dj-ci' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:12567/readyz >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:12567/ | grep -q '<title>2-Minute DJ'
          curl -fsSL http://127.0.0.1:12567/host/ | grep -q '<title>2-Minute DJ'
          curl -fsS http://127.0.0.1:12567/readyz | grep -q '"ok":true'

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # The deploy step proves the repository and branch to Gandalf with it.
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: ./Containerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Runs the pushed digest on Citadel through the Gandalf app platform; the node
      # rolls back if the app does not become healthy, which fails this step.
      - name: Deploy through Gandalf
        if: github.ref == 'refs/heads/main'
        uses: tionis/app-deploy@082b7d14b83de7b7d83225408b688597fbe3d37b
        with:
          service: 2-minute-dj
          image: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
